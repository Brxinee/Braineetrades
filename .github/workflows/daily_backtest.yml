name: Daily Backtest Refresh

on:
  schedule:
    - cron: '30 10 * * 1-5'  # 16:00 IST (UTC+5:30 = 10:30 UTC), Mon–Fri
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push result JSON files

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas==2.2.3 numpy==1.26.4 pytz yfinance fastapi pydantic scipy

    - name: Run full backtest (all 5 strategies, 60-day window)
      run: python -m backtest.runner --strategy all --days 60

    - name: Commit and push results
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add public/data/results/ public/data/leaderboard.json
        git diff --staged --quiet || git commit -m "chore: daily backtest refresh [skip ci]"
        git push
