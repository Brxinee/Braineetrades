name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas==2.2.3 numpy==1.26.4 pytz yfinance fastapi pydantic pytest

    - name: Run strategy tests
      run: |
        python -m pytest strategies/tests/ -v --tb=short

    - name: Run options backtest tests
      run: |
        python -m pytest backtest/nifty_options/tests/ -v --tb=short

    - name: Verify backend imports
      run: |
        python -c "
        import sys; sys.path.insert(0, '.')
        from backend import (
            data_loader, indicators, regime, strategies,
            options, risk, backtest, analytics,
            market_internals, alerts, replay, scanners
        )
        from backend.main import app
        assert len(app.routes) >= 18, f'Expected >=18 routes, got {len(app.routes)}'
        print(f'OK — {len(app.routes)} routes registered')
        "
